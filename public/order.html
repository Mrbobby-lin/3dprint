<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>订单详情 · B&O</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- 装到主屏幕后由系统显示的名字，要和 manifest 里的 short_name 一致。
       iOS 只认这个 meta，不读 manifest 的 short_name。 -->
  <meta name="apple-mobile-web-app-title" content="B&O 订单">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <header class="topbar no-print">
    <div class="topbar-inner">
      <a class="brand" href="/">订单查询</a>
      <nav>
        <a href="#" id="logout-link">查询其他订单</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="message"></div>

    <div id="content" class="hidden">
      <div class="card">
        <div class="row-between">
          <div>
            <div class="muted small">订单号</div>
            <div class="order-no-display" id="order-no"></div>
          </div>
          <div class="row">
            <span id="status-badge"></span>
          </div>
        </div>
        <div class="row mt-md no-print">
          <button class="btn btn-sm" id="copy-btn">复制订单号</button>
          <button class="btn btn-sm" id="print-btn">打印/保存</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>打印进度</h2>
          <span class="muted small" id="updated-at"></span>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>订单信息</h2>
        </div>
        <div class="info-grid" id="info"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>文件</h2>
          <span class="muted small">支持 STL / 3MF / OBJ 与图片</span>
        </div>
        <ul class="attach-list" id="attachments"></ul>
        <div class="mt-md" id="upload-area"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>售后 / 咨询</h2>
          <div class="row">
            <span class="muted small" id="ticket-hint"></span>
            <button class="btn btn-primary btn-sm no-print" id="new-ticket-btn">提交新工单</button>
          </div>
        </div>

        <!-- 表单放在列表上面：工单多了以后，按钮在顶部而表单在底部会点完看不见 -->
        <form id="ticket-form" class="ticket-form hidden no-print" novalidate>
          <div class="field">
            <label for="ticket-category">问题类型</label>
            <select id="ticket-category"></select>
          </div>
          <div class="field">
            <label for="ticket-subject">标题</label>
            <input type="text" id="ticket-subject" maxlength="60"
                   placeholder="一句话说明问题，例如：支撑印得一塌糊涂">
          </div>
          <div class="field">
            <label for="ticket-body">详细说明</label>
            <textarea id="ticket-body" maxlength="2000"
                      placeholder="什么时候发现的、哪个部位有问题、希望怎么处理"></textarea>
          </div>
          <div class="row">
            <button type="submit" class="btn btn-primary" id="ticket-submit-btn">提交</button>
            <button type="button" class="btn btn-link" id="ticket-cancel-btn">取消</button>
          </div>
        </form>

        <div id="tickets"></div>
      </div>
    </div>

    <div id="loading" class="card">
      <div class="skeleton mb-0"></div>
    </div>
  </main>

  <script src="/js/pwa.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/order.js" defer></script>
</body>
</html>
