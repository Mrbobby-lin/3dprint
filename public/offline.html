<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>没有网络 · B&O</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="B&O 订单">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <main class="container container-narrow">
    <div class="card">
      <div class="app-brand">
        <img src="/favicon.svg" alt="" width="26" height="26">
        <span class="app-brand-name">B&O 订单管理系统</span>
      </div>
      <h1>当前没有网络</h1>
      <p class="muted small mt-sm">
        订单进度和工单都是实时数据，必须联网才能查看 —— 我们没有把订单内容
        存在本机，所以断网时看不到上次的结果。
      </p>
      <div class="row mt-md">
        <button class="btn btn-primary" id="retry-btn">重新加载</button>
      </div>
    </div>
  </main>

  <script src="/js/offline.js" defer></script>
</body>
</html>
