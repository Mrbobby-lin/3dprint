<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>管理员登录 · B&O</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- 装到主屏幕后由系统显示的名字，要和 manifest 里的 short_name 一致。
       iOS 只认这个 meta，不读 manifest 的 short_name。 -->
  <meta name="apple-mobile-web-app-title" content="B&O 后台">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <main class="container container-narrow">
    <div class="card">
      <h1>管理员登录</h1>
      <div id="message" class="mt-md"></div>

      <form id="login-form" class="mt-md" novalidate>
        <div class="field">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">登录</button>
      </form>
    </div>

    <p class="center small muted mt-md hidden" id="register-hint">
      还没有账号？<a href="/admin/register">首次使用请注册管理员</a>
    </p>
    <p class="center small muted mt-md">
      <a href="/">返回订单查询</a>
    </p>
  </main>

  <script src="/js/pwa.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/admin-login.js" defer></script>
</body>
</html>
