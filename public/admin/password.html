<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>修改密码 · B&O</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- 装到主屏幕后由系统显示的名字，要和 manifest 里的 short_name 一致。
       iOS 只认这个 meta，不读 manifest 的 short_name。 -->
  <meta name="apple-mobile-web-app-title" content="B&O 后台">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <header class="topbar no-print">
    <div class="topbar-inner">
      <a class="brand" href="/admin/orders">B&O 订单管理</a>
      <nav>
        <a href="/admin/orders">订单列表</a>
        <a href="/admin/order/form">新建订单</a>
        <a href="/admin/tickets">工单</a>
        <a href="/admin/settings">设置</a>
        <a href="/admin/password">修改密码</a>
        <a href="#" id="logout-link">退出</a>
      </nav>
    </div>
  </header>

  <main class="container container-narrow">
    <div class="card">
      <h1>修改密码</h1>
      <div class="alert alert-info mt-md">
        修改后，其它设备上的登录会立即失效，需要重新登录。
      </div>

      <div id="message" class="mt-md"></div>

      <form id="password-form" class="mt-md" novalidate>
        <div class="field">
          <label for="current">当前密码</label>
          <input type="password" id="current" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="next">新密码</label>
          <input type="password" id="next" autocomplete="new-password"
                 placeholder="至少 10 位，需含字母和数字" required>
        </div>
        <div class="field">
          <label for="confirm">确认新密码</label>
          <input type="password" id="confirm" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">保存</button>
      </form>
    </div>
  </main>

  <script src="/js/pwa.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/admin-password.js" defer></script>
</body>
</html>
