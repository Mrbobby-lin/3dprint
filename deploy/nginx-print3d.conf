# 3D 打印订单管理系统 —— Nginx 反向代理
#
# 当前形态：只有 IP，没有域名和证书，所以是纯 HTTP。
# 这套配置里所有安全措施都在应用层（签名 cookie、限流、权限判定），
# 但 HTTP 意味着它们全都在明文信道上跑。补 HTTPS 的步骤见 deploy/README.md。

# 订单号查询是全站唯一的未认证入口，按 IP 限速。
# 应用内已经有两层限流（按 IP + 全站总量），放在 Nginx 这一层的目的是
# 让枚举流量直接被丢弃，不消耗 Node 进程的 CPU。
limit_req_zone $binary_remote_addr zone=lookup:10m rate=20r/m;

# 管理员登录同样暴露在公网，而且只有一个账号，值得单独限一道
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# 兜底 server：Host 不是本机 IP 的请求一律断开。
# 防止有人把自己的域名解析到这台机器，把本系统挂到他的域名下对外服务。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 150.158.18.245;

    server_tokens off;

    # 必须与 .env 的 MAX_UPLOAD_BYTES 保持一致。
    # 放在 Nginx 这一层，超限的请求体根本不会进到 Node。
    client_max_body_size 20m;
    client_body_timeout 60s;

    # ↓ 这几个头必须由 Nginx 覆盖写入，不能追加。
    #
    #   X-Forwarded-For 用 $remote_addr，绝不能用 $proxy_add_x_forwarded_for：
    #   客户端可以自己带一个 X-Forwarded-For 头过来，追加等于把伪造值
    #   一起传下去。配合应用侧 trust proxy = 'loopback'，限流才拿得到真实 IP。
    #   这两处任一配错，整套 IP 限流形同虚设，而且不会有任何报错。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    # 保险丝：上传目录绝不能由 Nginx 直接托管。
    # 下载一律走 /api/files/:id，由服务端判定权限后再 sendFile。
    location /storage/ {
        return 404;
    }

    # 健康检查不写访问日志，免得把 Nginx 日志刷满
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/customer/lookup {
        limit_req zone=lookup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
