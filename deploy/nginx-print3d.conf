# B&O 订单管理系统 —— Nginx 反向代理（80 端口）
#
# 这个文件只负责 80 端口：ACME 续期挑战 + 反代给 Node。
# 443 的 TLS 配置在 nginx-print3d-tls.conf 里，**签发证书之后**才能装
# （证书文件不存在时 nginx 起不来）。两个文件共用 nginx-print3d-proxy.conf。
#
# 安全措施大多在应用层（签名 cookie、限流、权限判定），但 HTTP 下它们
# 全在明文信道上跑 —— 所以这个形态只是过渡。补 HTTPS 见 deploy/README.md 第 7 节。

# 订单号查询是全站唯一的未认证入口，按 IP 限速。
# 应用内已经有两层限流（按 IP + 全站总量），放在 Nginx 这一层的目的是
# 让枚举流量直接被丢弃，不消耗 Node 进程的 CPU。
limit_req_zone $binary_remote_addr zone=lookup:10m rate=20r/m;

# 管理员登录同样暴露在公网，而且只有一个账号，值得单独限一道
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# 兜底 server：Host 不是本机 IP 的请求一律断开。
# 防止有人把自己的域名解析到这台机器，把本系统挂到他的域名下对外服务。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 150.158.18.245;

    server_tokens off;

    # ---------------------------------------------------------------------
    # Let's Encrypt 的 HTTP-01 挑战目录。
    #
    # 放在这个 server 块里、且用 ^~ 前缀，是为了让它优先于下面所有 location。
    # 续期每 4 天左右跑一次，挑战失败了证书就断 —— 这个 location 不能删。
    # 路径对应 certbot 的 --webroot -w /var/www/certbot：
    # certbot 写 /var/www/certbot/.well-known/acme-challenge/<token>，
    # 这里 root 指到 /var/www/certbot，URI 正好对上。
    # ---------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    include /etc/nginx/snippets/print3d-proxy.conf;

    # ---------------------------------------------------------------------
    # 强制跳 HTTPS。**默认关着，打开之前必须先确认外网 443 真的通。**
    # 打开办法：删掉下面那行行首那个 `#`（就一个字符，别改动其它内容），
    #          然后 nginx -t && systemctl reload nginx。
    #
    # 顺序错了会把站弄挂：443 不通 + 这个跳转开着 = 谁都打不开。
    # 确认办法是在你自己的电脑上跑（不是在服务器上 —— 从服务器访问自己的
    # 公网 IP 走本机路径，绕过安全组，测不出来）：
    #   curl -m 8 -sS -o /dev/null -w '%{http_code}\n' https://150.158.18.245/
    # 那一步要等腾讯云安全组放行 443，控制台操作。见 deploy/README.md 第 7.2 节。
    #
    # 用 server 级 if 而不是 `location / { return 302 }`：后者只覆盖命中
    # `location /` 的请求，/api/auth/ 之类的 location 会绕过它继续走 HTTP ——
    # 管理员密码就还是在明文信道上跑。这里的 if 在 location 匹配之前生效，
    # 唯一放行的是上面那个 ACME 挑战目录（续期要靠它）。
    #
    # 302 而不是 301：证书只有 6 天，续期万一失败要把跳转撤掉。
    # 301 会被浏览器长期缓存，撤不干净。
    # ---------------------------------------------------------------------
    #if ($request_uri !~ ^/\.well-known/acme-challenge/) { return 302 https://$host$request_uri; }
}
