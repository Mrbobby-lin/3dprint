# B&O 订单管理系统 —— Nginx 443（HTTPS）
#
# ⚠️ 这个文件**必须在证书签发成功之后**才装到 /etc/nginx/conf.d/。
#    证书文件不存在时 nginx 起不来（ssl_certificate 指向的文件读不到），
#    而 nginx 起不来 = 整个站没了。deploy/setup-https.sh 会按正确顺序做这件事。
#
# 用的是 Let's Encrypt 的 IP 证书（shortlived profile，有效期 160 小时 ≈ 6.7 天）。
# 只能用 IP 是因为这台机器没有已备案的域名；大陆节点上没备案的域名
# 解析过来 80/443 会被拦。拿到备案域名后，把 server_name 和两个证书路径
# 换成域名即可，其余不用动。

# 兜底 server：443 上同样要有一个，否则"别人把域名解析到这台 IP"时
# 443 会落到第一个 server 块，等于用我们的证书替他服务。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 兜底块也要给一个证书，否则 nginx 不肯加载这个 server。
    # 反正它的作用就是握手后立刻断开，用哪张证书都无所谓。
    ssl_certificate     /etc/letsencrypt/live/150.158.18.245/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/150.158.18.245/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 150.158.18.245;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/150.158.18.245/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/150.158.18.245/privkey.pem;

    # 只留 TLS 1.2/1.3。1.0/1.1 早已被主流浏览器弃用，留着只是多一份攻击面。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 会话票据会绕过会话缓存的失效控制，且短有效期证书下收益很小，关掉
    ssl_session_tickets off;

    # 刻意不开 OCSP stapling：Let's Encrypt 已经停掉 OCSP，短有效期证书
    # 只带 CRL。开了 stapling 也 staple 不到东西，只会在 error_log 里刷警告。

    include /etc/nginx/snippets/print3d-proxy.conf;
}
