# B&O 订单管理系统 —— 反代主体（HTTP 和 HTTPS 共用）
#
# 这个文件被 nginx-print3d.conf（80）和 nginx-print3d-tls.conf（443）
# 同时 include。抽出来不是为了好看：下面那几行 X-Forwarded-* 是安全相关的，
# 一旦两处各写一份，改了其中一处就会出现"HTTP 下限流有效、HTTPS 下形同虚设"
# 这种不会报错、也测不出来的分裂状态。

# 必须与 .env 的 MAX_UPLOAD_BYTES 保持一致。
# 放在 Nginx 这一层，超限的请求体根本不会进到 Node。
client_max_body_size 20m;
client_body_timeout 60s;

# ↓ 这几个头必须由 Nginx 覆盖写入，不能追加。
#
#   X-Forwarded-For 用 $remote_addr，绝不能用 $proxy_add_x_forwarded_for：
#   客户端可以自己带一个 X-Forwarded-For 头过来，追加等于把伪造值
#   一起传下去。配合应用侧 trust proxy = 'loopback'，限流才拿得到真实 IP。
#   这两处任一配错，整套 IP 限流形同虚设，而且不会有任何报错。
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_read_timeout 60s;

# 保险丝：上传目录绝不能由 Nginx 直接托管。
# 下载一律走 /api/files/:id，由服务端判定权限后再 sendFile。
location /storage/ {
    return 404;
}

# 健康检查不写访问日志，免得把 Nginx 日志刷满
location = /api/health {
    access_log off;
    proxy_pass http://127.0.0.1:3000;
}

location = /api/customer/lookup {
    limit_req zone=lookup burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
}

location ^~ /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
}

location / {
    proxy_pass http://127.0.0.1:3000;
}
